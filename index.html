<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ответы ИК и ПК</title>
  <meta name="description" content="Быстрый поиск по вопросам и ответам: новейшая история Узбекистана, клинические основы специальной педагогики, общая психология.">
  <meta name="theme-color" content="#0d0e10">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Ответы">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 7V5h11v2M9.5 5v14M7.5 19h4M14 12v-1.5h7V12M17.5 10.5V19M16 19h3"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM13 4h5.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H13z"/></symbol>
    <symbol id="i-hash" viewBox="0 0 24 24"><path d="M9 4 7 20M17 4l-2 16M4.5 9h16M3.5 15h16"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="m7 9 5-5 5 5M7 15l5 5 5-5"/></symbol>
    <symbol id="i-collapse" viewBox="0 0 24 24"><path d="m7 4 5 5 5-5M7 20l5-5 5 5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
  </svg>

  <a class="skip" href="#main">К содержимому</a>

  <div class="app">
    <header class="top" id="top">
      <div class="bar">
        <a class="icon-btn home" href="#/" aria-label="Все файлы" title="Все файлы"><svg class="i"><use href="#i-home"/></svg></a>
        <nav class="seg" id="fileSeg" aria-label="Файлы"></nav>
        <div class="menu push" id="sizeMenu">
          <button class="icon-btn" type="button" id="sizeBtn" aria-label="Размер текста" title="Размер текста" aria-haspopup="true" aria-expanded="false" aria-controls="sizeList"><svg class="i"><use href="#i-text"/></svg></button>
          <div class="menu-list size-list" id="sizeList" hidden>
            <span class="size-label">Размер текста</span>
            <div class="size-row">
              <button class="btn sm" type="button" id="sizeDown" aria-label="Уменьшить текст">A−</button>
              <output class="size-val" id="sizeVal" aria-live="polite"></output>
              <button class="btn sm" type="button" id="sizeUp" aria-label="Увеличить текст">A+</button>
            </div>
          </div>
        </div>
      </div>

      <div class="search" role="search">
        <div class="c-box">
          <svg class="i s-ic" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="q" class="c-title" type="search" autocomplete="off" autocorrect="off" spellcheck="false"
                 enterkeyhint="search" placeholder="Вопрос или номер, например 14"
                 role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list"
                 aria-label="Поиск по вопросам трех файлов">
          <button class="icon-btn s-clear" id="clear" type="button" aria-label="Очистить поиск" hidden><svg class="i"><use href="#i-x"/></svg></button>
        </div>
        <div class="fpanel results" id="results-panel" hidden>
          <p class="r-sum" id="summary" aria-live="polite"></p>
          <div id="results" role="listbox" aria-label="Найденные вопросы"></div>
        </div>
      </div>
    </header>
    <div class="scrim" id="scrim" hidden></div>

    <main id="main" tabindex="-1"></main>
  </div>

  <button class="icon-btn to-top" id="toTop" type="button" aria-label="Наверх" hidden><svg class="i"><use href="#i-up"/></svg></button>

  <noscript><p class="app">Для поиска и навигации нужен включенный JavaScript.</p></noscript>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
